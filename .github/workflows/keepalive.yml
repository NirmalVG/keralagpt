name: Keep Supabase Alive

on:
  schedule:
    # Twice a week — Free projects pause after ~7 days of low DB activity
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database (required)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing secrets: set SUPABASE_URL and SUPABASE_SERVICE_KEY in repo Settings → Secrets"
            exit 1
          fi

          # Real PostgREST query counts as DB activity (unlike /auth/v1/health)
          url="${SUPABASE_URL%/}/rest/v1/documents?select=id&limit=1"
          echo "Pinging $url"
          code=$(curl -s -o /tmp/keepalive.json -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Accept: application/json" \
            "$url")
          echo "HTTP $code"
          cat /tmp/keepalive.json || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "Supabase keepalive failed"
            exit 1
          fi
          echo "Supabase keepalive OK"

      - name: Wake Render API (optional)
        continue-on-error: true
        run: |
          curl -s -o /dev/null --max-time 120 https://keralagpt-api.onrender.com/health || true
          sleep 5
          curl -s -o /dev/null -w "Render keepalive HTTP %{http_code}\n" --max-time 60 \
            https://keralagpt-api.onrender.com/health/keepalive || true
